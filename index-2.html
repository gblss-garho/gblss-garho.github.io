        if (children.length === 0) {
            const text = (el.textContent || "").replace(/\s+/g, " ").trim();

                const size = parseFloat(cs.fontSize) || 13;
                const weight = parseInt(cs.fontWeight, 10) || 400;

            return;

        const a = document.createElement("a");

        document.body.appendChild(a);

        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);

    }
}
function calcServiceDuration(entryDate) {
    if (!entryDate)
        return "—";
    const start = new Date(entryDate);
    if (isNaN(start.getTime()))
        return "—";
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    let months = now.getMonth() - start.getMonth();
    if (now.getDate() < start.getDate())
        months--;
    if (months < 0) {
        years--;
        months += 12;
    }
    if (years < 0)
        return "—";
    const yStr = years > 0 ? `${years} year${years !== 1 ? "s" : ""}` : "";
    const mStr = months > 0 ? `${months} month${months !== 1 ? "s" : ""}` : "";
    return [yStr, mStr].filter(Boolean).join(", ") || "< 1 month";
}

/* ---------- School Leaving Certificate — issued records (year-wise) ----------

   آهي (جيئن پرنٽ ٿيل Leaving Certificate تي درج هوندو آهي). نئون batch/year شامل
   ڪرڻ لاءِ هيٺ mkLC(...) جا نوان calls DEFAULT_LC_RECORDS ۾ شامل ڪريو،
   يا App کلڻ کان پوءِ Edit Mode مان "+ Add Record" بٽڻ استعمال ڪريو.
------------------------------------------------------------------------------ */
function mkLC(gr, name, fatherName, caste, placeOfBirth, dob, dobWords, lastSchool, admissionDate, admittedClass = "VI", opts = {}) {
    return {
        id: uid(),
        grNumber: gr,
        name,
        fatherName,
        religion: opts.religion || "Islam",
        caste,
        placeOfBirth,
        dob,
        dobWords,
        lastSchool,
        admissionDate,
        admittedClass,
        progress: opts.progress || "Good",
        conduct: opts.conduct || "Good",
        passedClass: opts.passedClass || "VIII",
        leavingDate: opts.leavingDate || "Mar 29, 2025",
        reason: opts.reason || "VIII Class Passed",
        dues: opts.dues || "Nil",
        remarks: opts.remarks || "L.C Issued",
        issueDate: opts.issueDate || "Mar 29, 2025",
        year: opts.year || "2024-2025",
    };
}

    try {
        if (key === SCHOOL_KEY) {
            const { data, error } = await gblssDb.from("school_info").select("*").eq("id", true).maybeSingle();
            if (error) throw error;
            if (!data) return fallback;
            const value = { name: data.name, urduName: data.urdu_name, motto: data.motto, address: data.address, phone: data.phone, email: data.email, emisCode: data.emis_code, establishedYear: data.established_year, aboutText: data.about_text, principalName: data.principal_name, principalMessage: data.principal_message, principalPhotoUrl: data.principal_photo_url, deoName: data.deo_name, deoMessage: data.deo_message, deoPhotoUrl: data.deo_photo_url, teoName: data.teo_name, teoMessage: data.teo_message, teoPhotoUrl: data.teo_photo_url, schoolPhotoUrl: data.school_photo_url, schoolLat: data.school_lat, schoolLng: data.school_lng, mapLocation: data.map_location, attendanceRadius: data.attendance_radius, totalClasses: data.total_classes, shifts: data.shifts, currentExamTitle: data.current_exam_title, currentExamYear: data.current_exam_year, schoolStartTime: data.school_start_time, timeInWindowStart: data.time_in_window_start, timeInWindowEnd: data.time_in_window_end, timeOutWindowStart: data.time_out_window_start, timeOutWindowEnd: data.time_out_window_end, weeklyOffDays: data.weekly_off_days };
            try { localStorage.setItem("gblss_" + key, JSON.stringify(value)); } catch (_e) { }
            return value;
        }
        if (key === ATTENDANCE_KEY) {
            const { data, error } = await gblssDb.rpc("get_attendance_records");
            if (error) throw error;
            const value = data || [];
            try { localStorage.setItem("gblss_" + key, JSON.stringify(value)); } catch (_e) { }
            return value;
        }
        const adapter = TABLE_ADAPTERS[key];
        if (adapter) {
            const { data, error } = await gblssDb.from(adapter.table).select("*");
            if (error) throw error;
            const value = (data || []).map(adapter.fromRow);
            try { localStorage.setItem("gblss_" + key, JSON.stringify(value)); } catch (_e) { }
            return value;
        }
        // Fallback: legacy generic blob (kept as a safety net for any key not yet migrated)
        const { data, error } = await gblssDb.from("gblss_data").select("value").eq("key", key).maybeSingle();
        if (error)
            throw error;
        if (data) {
            try { localStorage.setItem("gblss_" + key, JSON.stringify(data.value)); } catch (_e) { }
            return data.value !== undefined && data.value !== null ? data.value : fallback;
        }
        return fallback;
    }
    catch (e) {
        console.error("Supabase load failed, using local cache", key, e);
        try {
            const raw = localStorage.getItem("gblss_" + key);
            return raw ? JSON.parse(raw) : fallback;
        }
        catch (_a) {
            return fallback;
        }
    }
}

async function saveGenericTable(table, rows, idKey) {
    // Upsert everything first, then prune whatever's left over — never delete
    // before the replacement rows are safely in, so a dropped connection
    // mid-save can't leave the table empty.
    if (rows.length > 0) {
        const { error: upErr } = await gblssDb.from(table).upsert(rows, { onConflict: idKey });
        if (upErr) throw upErr;
    }
    const { data: existing, error: selErr } = await gblssDb.from(table).select(idKey);
    if (selErr) throw selErr;
    const keep = new Set(rows.map((r) => r[idKey]));
    const toDelete = (existing || []).map((r) => r[idKey]).filter((id) => !keep.has(id));
    if (toDelete.length > 0) {
        const { error: delErr } = await gblssDb.from(table).delete().in(idKey, toDelete);
        if (delErr) throw delErr;
    }
}

    const [showMoreMenu, setShowMoreMenu] = useState(false);
    const [loading, setLoading] = useState(true);
    const [school, setSchool] = useState(DEFAULT_SCHOOL);
    const [teachers, setTeachers] = useState([]);
    const [students, setStudents] = useState([]);
    const [gallery, setGallery] = useState([]);
    const [lcRecords, setLcRecords] = useState([]);
    const [feedbackList, setFeedbackList] = useState([]);
    const [contactMessages, setContactMessages] = useState([]);
    const [textbooks, setTextbooks] = useState([]);
    const [funtimeList, setFuntimeList] = useState([]);
    const [calendarList, setCalendarList] = useState([]);
    const [notices, setNotices] = useState([]);
    const [homeworkList, setHomeworkList] = useState([]);
    const [attendance, setAttendance] = useState([]);
    const [teacherAttMonth, setTeacherAttMonth] = useState([]);
    const [leaveRequests, setLeaveRequests] = useState([]);
    const [bookCatalog, setBookCatalog] = useState([]);
    const [bookIssues, setBookIssues] = useState([]);
    const [resultPublishStatus, setResultPublishStatus] = useState([]);
    const [isOnline, setIsOnline] = useState(typeof navigator !== "undefined" ? navigator.onLine : true);
    const [pendingSyncCount, setPendingSyncCount] = useState(0);
    // Replays every queued offline write (currently: attendance) against
    // Supabase. Each item is removed from the queue only after a confirmed
    // server success; a failure just bumps retryCount and leaves it queued
    // for the next attempt (next reconnect, or next manual Sync Now).
    async function processSyncQueue() {
        if (!navigator.onLine)
            return;
        let all = [];
        try {
            all = await idbGetAll("syncQueue");
        }
        catch (e) {
            return;
        }
        let anySynced = false;
        for (const item of all) {
            try {
                if (item.entity === "attendance" && item.operation === "upsert_attendance_record") {
                    const { error } = await gblssDb.rpc("upsert_attendance_record", { p_class_name: item.payload.className, p_date: item.payload.date, p_marks: item.payload.marks });
                    if (error)
                        throw error;
                    Object.entries(item.payload.marks || {}).filter(([, status]) => status === "A").forEach(([studentId]) => {
                        gblssDb.functions.invoke("send-absence-whatsapp", { body: { studentId, className: item.payload.className, date: item.payload.date } })
                            .catch((e) => console.warn("WhatsApp absence alert failed for", studentId, e));
                    });
                }
                await idbDeleteKey("syncQueue", item.id);
                anySynced = true;
            }
            catch (e) {
                await idbUpdateRecord("syncQueue", item.id, { retryCount: (item.retryCount || 0) + 1, lastError: String((e && e.message) || e) });
            }
        }
        const remaining = await idbGetAll("syncQueue");
        setPendingSyncCount(remaining.length);
        if (anySynced) {
            const fresh = await loadShared(ATTENDANCE_KEY, []);
            setAttendance(fresh);
        }
    }
    useEffect(() => {
        function goOnline() { setIsOnline(true); refreshOfflineLookupCache(); processSyncQueue(); }
        function goOffline() { setIsOnline(false); }
        window.addEventListener("online", goOnline);
        window.addEventListener("offline", goOffline);
        idbGetAll("syncQueue").then((q) => setPendingSyncCount((q || []).length));
        if (navigator.onLine)
            processSyncQueue(); // flush anything queued from a previous session that never got to sync
        return () => {
            window.removeEventListener("online", goOnline);
            window.removeEventListener("offline", goOffline);
        };
    }, []);
    const [session, setSession] = useState(null);
    const [authChecked, setAuthChecked] = useState(false);
    const [showLoginModal, setShowLoginModal] = useState(false);
    const [showResetPasswordModal, setShowResetPasswordModal] = useState(false);
    const [staffDataLoaded, setStaffDataLoaded] = useState(false);
    // A teacher's own record is matched by their Supabase Auth email (set once by
    // admin in "Edit Teacher" -> AUTH EMAIL). Full Admin access is granted ONLY to
    // emails in ADMIN_EMAILS — an unlinked/unknown signed-in account gets NO edit
    // access and is treated like a visitor (this closes the old "anyone who signs
    // up becomes admin" bug).
    const myStaffTeacher = session ? teachers.find((t) => t.authEmail && t.authEmail.trim().toLowerCase() === (session.user.email || "").trim().toLowerCase()) : null;
    const isAdminSession = !!session && isAdminEmail(session.user.email);
    // Full edit mode (school info, teachers/students CRUD, results, gallery, etc.)
    // is admin-only. Regular teachers only get their own Teacher Portal tab and
    // Attendance — gated separately below by `!!session`, not `editMode`.
    const editMode = isAdminSession;
    const [editSchoolOpen, setEditSchoolOpen] = useState(false);
    const [teacherModal, setTeacherModal] = useState(null); // object being edited or {} for new
    const [studentModal, setStudentModal] = useState(null);
    const [galleryModal, setGalleryModal] = useState(null);
    const [idCardTarget, setIdCardTarget] = useState(null); // {type, person}
    const [studentFilter, setStudentFilter] = useState("");
    const [marksModal, setMarksModal] = useState(null); // {student, examType}
    const [resultClassFilter, setResultClassFilter] = useState("");
    const [resultExamType, setResultExamType] = useState("annual");
    const [resultSubject, setResultSubject] = useState(SUBJECTS[0][0]);
    const [slcTarget, setSlcTarget] = useState(null); // student for leaving certificate
    const [lcModal, setLcModal] = useState(null); // record being edited or {} for new
    const [lcYearFilter, setLcYearFilter] = useState("all");
    // One-shot "please open this" request sent from the Alumni tab into the
    // Leaving Certificate tab (either a specific issued record to view/print,
    // or "switch to Quick Generate mode" for a student who has no LC record
    // yet). A fresh object is created on every click so the effect inside
    // LeavingCertificateTab always re-fires, even for the same record twice.
    const [slcOpenRequest, setSlcOpenRequest] = useState(null);
    // Public-safe summary (counts + stripped teacher list, no CNIC/PID/DOB) —
    // powers the Home stats and public Teachers directory for anonymous
    // visitors, via the get_public_summary RPC (SECURITY DEFINER, so it can
    // read the otherwise-locked-down teachers/students rows safely).
    const [publicSummary, setPublicSummary] = useState({ studentCount: 0, teacherCount: 0, teachers: [], classCounts: [], toppers: [] });
    useEffect(() => {
        (async () => {
            const { data, error } = await gblssDb.rpc("get_public_summary");
            if (!error && data) {
                setPublicSummary({
                    studentCount: data.studentCount || 0,
                    teacherCount: data.teacherCount || 0,
                    teachers: Array.isArray(data.teachers) ? data.teachers : [],
                    classCounts: Array.isArray(data.classCounts) ? data.classCounts : [],
                    toppers: Array.isArray(data.toppers) ? data.toppers : [],
                });
            }
        })();
    }, []);
    const displayStudentCount = session ? students.filter((s) => !s.passedOut).length : publicSummary.studentCount;
    const displayTeachers = session ? teachers : publicSummary.teachers;
    const HOME_CLASSES = ["VI", "VII", "VIII"];
    function computeHomeClassCounts(list) {
        const active = list.filter((s) => !s.passedOut);
        return HOME_CLASSES.map((c) => ({ cls: c, count: active.filter((s) => s.class === c).length }));
    }
    function computeHomeToppers(list) {
        // Note: do NOT filter out passedOut students here. Finishing Class VIII's
        // annual exam is what marks a student passedOut, so excluding them would
        // mean Class VIII could never have a topper. The class-wise Strength
        // widget (computeHomeClassCounts) is where passedOut exclusion belongs.
        return HOME_CLASSES.map((c) => {
            const scored = list.filter((s) => (s.resultsClassOverride || s.class) === c).map((s) => {
                const m = (s.results && s.results.annual) || {};
                const vals = SUBJECTS.map(([k]) => m[k]).filter((v) => v !== undefined && v !== null && v !== "");
                if (vals.length === 0)
                    return null;
                return { cls: c, name: s.name, photoUrl: s.photoUrl, total: vals.reduce((a, b) => a + Number(b), 0) };
            }).filter(Boolean).sort((a, b) => b.total - a.total)[0];
            return scored;
        }).filter(Boolean);
    }
    const homeClassCounts = session ? computeHomeClassCounts(students) : publicSummary.classCounts;
    const homeToppers = session ? computeHomeToppers(students) : publicSummary.toppers;
    // "Regular of the Month" spotlights — computed client-side from the
    // staff-only attendance data already loaded above, scoped to the current
    // calendar month. Only meaningful once staff are logged in (attendance /
    // teacher_attendance rows aren't fetched for anonymous visitors at all —
    // see the "SENSITIVE data" effect), so these are null on the public site
    // until someone signs in. MIN_DAYS avoids crowning someone off 1-2 records.
    const MIN_DAYS_FOR_AWARD = 5;
    const monthKey = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}`; })();
    function computeMostRegularStudent() {
        const active = students.filter((s) => !s.passedOut);
        const scored = active.map((s) => {
            let present = 0, total = 0;
            attendance.forEach((rec) => {
                if (rec.className !== s.class || !rec.date || !rec.date.startsWith(monthKey))
                    return;
                const mark = rec.marks && rec.marks[s.id];
                if (mark === "P") { present++; total++; }
                else if (mark === "A") { total++; }
            });
            return { name: s.name, photoUrl: s.photoUrl, cls: s.class, present: present, total: total, pct: total > 0 ? present / total : 0 };
        }).filter((x) => x.total >= MIN_DAYS_FOR_AWARD);
        scored.sort((a, b) => b.pct - a.pct || b.present - a.present);
        return scored[0] || null;
    }
    function timeInMinutes(iso) {
        // Extracts HH:MM (Asia/Karachi) from an ISO timestamp as minutes-since-midnight,
        // so a time_in can be compared against school.schoolStartTime regardless of date.
        try {
            const parts = new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Karachi" }).split(":");
            return Number(parts[0]) * 60 + Number(parts[1]);
        }
        catch (_e) {
            return null;
        }
    }
    function computeMostRegularTeacher() {
        const cutoff = (school.schoolStartTime || "08:00").split(":");
        const cutoffMinutes = Number(cutoff[0]) * 60 + Number(cutoff[1] || 0);
        const byTeacher = {};
        teacherAttMonth.forEach((r) => {
            if (!r.date || !r.date.startsWith(monthKey) || !r.time_in)
                return;
            const mins = timeInMinutes(r.time_in);
            if (mins === null)
                return;
            const entry = byTeacher[r.teacher_id] || (byTeacher[r.teacher_id] = { present: 0, onTime: 0 });
            entry.present++;
            if (mins <= cutoffMinutes)
                entry.onTime++;
        });
        const scored = Object.keys(byTeacher).map((tid) => {
            const t = teachers.find((x) => x.id === tid);
            if (!t)
                return null;
            const entry = byTeacher[tid];
            return { name: t.name, photoUrl: t.photoUrl, subject: t.subject, present: entry.present, onTime: entry.onTime, pct: entry.present > 0 ? entry.onTime / entry.present : 0 };
        }).filter((x) => x && x.present >= MIN_DAYS_FOR_AWARD);
        scored.sort((a, b) => b.pct - a.pct || b.present - a.present);
        return scored[0] || null;
    }
    const mostRegularStudent = session ? computeMostRegularStudent() : null;
    const mostRegularTeacher = session ? computeMostRegularTeacher() : null;
    // 1. PUBLIC data only — safe to load for every anonymous visitor.
    useEffect(() => {
        (async () => {
            const [s, g, tb, ft, cal, nt, hw, rp, fb] = await Promise.all([
                loadShared(SCHOOL_KEY, DEFAULT_SCHOOL),
                loadShared(GALLERY_KEY, []),
                loadShared(TEXTBOOKS_KEY, []),
                loadShared(FUNTIME_KEY, []),
                loadShared(CALENDAR_KEY, []),
                loadShared(NOTICES_KEY, []),
                loadShared(HOMEWORK_KEY, []),
                loadShared(RESULT_PUBLISH_KEY, []),
                loadShared(FEEDBACK_KEY, []),
            ]);
            setSchool(s);
            setGallery(g);
            setTextbooks(tb);
            setFuntimeList(ft);
            setCalendarList(cal);
            setNotices(nt);
            setHomeworkList(hw);
            setResultPublishStatus(rp);
            setFeedbackList(fb);
            setLoading(false);
            refreshOfflineLookupCache(); // fire-and-forget, non-blocking
        })();
    }, []);
    // 2. Track the Supabase Auth session (initial check + live updates on login/logout).
    useEffect(() => {
        gblssDb.auth.getSession().then(({ data }) => {
            setSession(data.session);
            setAuthChecked(true);
        });
        const { data: authListener } = gblssDb.auth.onAuthStateChange((_event, sess) => {
            setSession(sess);
            if (_event === "PASSWORD_RECOVERY") {
                setShowResetPasswordModal(true);
            }
        });
        return () => { authListener.subscription.unsubscribe(); };
    }, []);
    // 3. SENSITIVE data — only fetched once a staff member is actually signed in.
    //    RLS on the server also enforces this; this just avoids requesting data
    //    the client isn't allowed to see.
    useEffect(() => {
        if (!authChecked)
            return;
        if (!session) {
            setTeachers([]);
            setStudents([]);
            setLcRecords([]);
            setAttendance([]);
            setTeacherAttMonth([]);
            setContactMessages([]);
            setLeaveRequests([]);
            setBookCatalog([]);
            setBookIssues([]);
            setStaffDataLoaded(false);
            return;
        }
        setStaffDataLoaded(false);
        (async () => {
            const now = new Date();
            const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-01`;
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const monthEnd = `${nextMonth.getFullYear()}-${String(nextMonth.getMonth() + 1).padStart(2, "0")}-01`;
            const [t, st, lc, att, cm, lv, tam, bc, bi] = await Promise.all([
                loadStaffScoped("get_staff_teachers", TEACHERS_KEY, DEFAULT_TEACHERS),
                loadStaffScoped("get_staff_students", STUDENTS_KEY, DEFAULT_STUDENTS),
                loadShared(LC_KEY, DEFAULT_LC_RECORDS),
                loadShared(ATTENDANCE_KEY, []),
                loadShared(CONTACT_MESSAGES_KEY, []),
                loadShared(LEAVE_KEY, []),
                gblssDb.from("teacher_attendance").select("*").gte("date", monthStart).lt("date", monthEnd),
                loadShared(BOOKBANK_CATALOG_KEY, []),
                loadShared(BOOKBANK_ISSUES_KEY, []),
            ]);
            setTeachers(t);
            setStudents(withComputedClass(st));
            setLcRecords(lc);
            setAttendance(att);
            setContactMessages(cm);
            setLeaveRequests(lv);
            setTeacherAttMonth((tam && tam.data) || []);
            setBookCatalog(bc);
            setBookIssues(bi);
            setStaffDataLoaded(true);
        })();
    }, [session, authChecked]);
    async function persistSchool(next) { setSchool(next); return await saveShared(SCHOOL_KEY, next); }
    async function persistTeachers(next) { setTeachers(next); return await saveShared(TEACHERS_KEY, next); }
    async function persistStudents(next) { const normalized = withComputedClass(next); setStudents(normalized); await saveShared(STUDENTS_KEY, normalized); }
    async function persistGallery(next) { setGallery(next); await saveShared(GALLERY_KEY, next); }
    async function persistLcRecords(next) { setLcRecords(next); await saveShared(LC_KEY, next); }
    async function persistFeedback(next) { setFeedbackList(next); await saveShared(FEEDBACK_KEY, next); }
    async function persistLeaveRequests(next) { setLeaveRequests(next); await saveShared(LEAVE_KEY, next); }
    async function persistResultPublishStatus(next) { setResultPublishStatus(next); await saveShared(RESULT_PUBLISH_KEY, next); }
    function setResultPublishForClass(className, examType, status) {
        const existing = getResultPublishRecord(resultPublishStatus, className, examType);
        const now = new Date().toISOString();
        if (existing) {
            persistResultPublishStatus(resultPublishStatus.map((r) => r.id === existing.id
                ? Object.assign(Object.assign({}, r), { status, publishedAt: status === "published" ? now : r.publishedAt })
                : r));
        }
        else {
            persistResultPublishStatus([...resultPublishStatus, { id: uid(), className, examType, status, publishedAt: status === "published" ? now : null }]);
        }
        // Fire-and-forget WhatsApp alert to every guardian in the class. The
        // Edge Function dedupes per (student, class+exam-type, day), so
        // publish → unpublish → publish again on the same day won't re-send.
        if (status === "published") {
            gblssDb.functions.invoke("send-result-whatsapp", { body: { className, examType, examLabel: EXAM_LABELS[examType] || examType, date: todayStr() } })
                .catch((e) => console.warn("WhatsApp result alert failed", e));
        }
    }
    function submitLeaveRequest(data) {
        // Teacher's own leave request — teacher is authenticated, RLS's "teacher
        // scoped insert leave requests" policy covers this direct read-modify-write.
        persistLeaveRequests([...leaveRequests, Object.assign(Object.assign({}, data), { id: uid(), status: "pending", type: "teacher", submittedAt: new Date().toISOString() })]);
    }
    async function submitStudentLeaveRequest(data) {
        // Anonymous parent/student on Parent's Corner can't SELECT leave-requests-list
        // (RLS), so a read-modify-write here would silently wipe everyone else's
        // requests. Same pattern as submitFeedback: a SECURITY DEFINER RPC appends
        // server-side. See handoff report SQL: public.submit_leave_request(payload jsonb).
        const entry = Object.assign({ id: uid(), status: "pending", type: "student", submittedAt: new Date().toISOString() }, data);
        const { error } = await gblssDb.rpc("submit_leave_request", { payload: entry });
        if (error) {
            console.error("Leave request submit failed", error);
            alert("Leave application FAILED: " + (error && error.message ? error.message : JSON.stringify(error)));
            return false;
        }
        if (session) {
            const lv = await loadShared(LEAVE_KEY, []);
            setLeaveRequests(lv);
        }
        return true;
    }
    function setLeaveStatus(id, status) {
        persistLeaveRequests(leaveRequests.map((r) => (r.id === id ? Object.assign(Object.assign({}, r), { status: status }) : r)));
    }
    function deleteLeaveRequest(id) {
        persistLeaveRequests(leaveRequests.filter((r) => r.id !== id));
    }
    // ---- Book Bank (Phase 10): catalog (class-wise stock) + student-wise issue records ----
    async function persistBookCatalog(next) { setBookCatalog(next); await saveShared(BOOKBANK_CATALOG_KEY, next); }
    function saveBookCatalogItem(data) {
        const next = data.id
            ? bookCatalog.map((b) => (b.id === data.id ? Object.assign(Object.assign({}, b), data) : b))
            : [...bookCatalog, Object.assign({ id: uid() }, data)];
        persistBookCatalog(recalcIssuedQty(next, bookIssues));
    }
    function deleteBookCatalogItem(id) {
        persistBookCatalog(bookCatalog.filter((b) => b.id !== id));
    }
    async function persistBookIssues(next) { setBookIssues(next); await saveShared(BOOKBANK_ISSUES_KEY, next); }
    // A book's "Issued" count is never hand-typed — it is always the live
    // count of that class+book's issue records that are NOT yet Returned.
    // Whenever an issue record is saved or deleted, every catalog row is
    // re-synced from bookIssues so Available/Issued/Remaining can never
    // drift out of sync with what was actually issued or returned.
    function recalcIssuedQty(catalog, issues) {
        const counts = {};
        issues.forEach((r) => {
            if (r.status !== "Returned") {
                const key = r.class + "|" + r.bookTitle;
                counts[key] = (counts[key] || 0) + 1;
            }
        });
        return catalog.map((b) => {
            const key = b.class + "|" + b.bookTitle;
            const issuedQty = counts[key] || 0;
            return issuedQty === Number(b.issuedQty || 0) ? b : Object.assign({}, b, { issuedQty });
        });
    }
    function saveBookIssue(data) {
        const nextIssues = data.id
            ? bookIssues.map((r) => (r.id === data.id ? Object.assign(Object.assign({}, r), data) : r))
            : [...bookIssues, Object.assign({ id: uid(), status: data.status || "Issued" }, data)];
        persistBookIssues(nextIssues);
        persistBookCatalog(recalcIssuedQty(bookCatalog, nextIssues));
    }
    function deleteBookIssue(id) {
        const nextIssues = bookIssues.filter((r) => r.id !== id);
        persistBookIssues(nextIssues);
        persistBookCatalog(recalcIssuedQty(bookCatalog, nextIssues));
    }
    // Bulk-import the 2026-27 stock register (Class VI/VII/VIII old-book
    // counts) into the Book Catalog. Matches on (class + subject, trimmed &
    // case-insensitive) so re-running it never creates duplicates of entries
    // it already added — it only adds rows that are genuinely missing.
    function applyBookBankStockData() {
        const norm = (v) => String(v || "").trim().toLowerCase();
        const existingKeys = new Set(bookCatalog.map((b) => norm(b.class) + "|" + norm(b.subject)));
        const toAdd = BOOKBANK_STOCK_BULK_DATA.filter((r) => !existingKeys.has(norm(r.class) + "|" + norm(r.subject)));
        if (toAdd.length === 0) {
            alert("سڀ 2026-27 اسٽاڪ اندراج اڳ ۾ ئي Book Catalog ۾ موجود آهن.");
            return;
        }
        if (!window.confirm(toAdd.length + " ڪيٽلاگ اندراج شامل ٿينديون (Class VI/VII/VIII 2026-27 اسٽاڪ رجسٽر مطابق). ڪنفرم ڪريو؟"))
            return;
        const next = [...bookCatalog, ...toAdd.map((r) => Object.assign({ id: uid() }, r))];
        persistBookCatalog(recalcIssuedQty(next, bookIssues));
        alert(toAdd.length + " catalog entries add ho gayi.");
    }
    async function submitFeedback(data) {
        // Anonymous visitors can't SELECT feedback-list (RLS), so we can't do a
        // read-modify-write here — it would silently wipe everyone else's feedback.
        // Instead we call a SECURITY DEFINER Postgres function that appends
        // server-side. See Step 1 SQL: public.submit_feedback(payload jsonb).
        const entry = Object.assign({ id: uid(), date: new Date().toISOString() }, data);
        const { error } = await gblssDb.rpc("submit_feedback", { payload: entry });
        if (error) {
            console.error("Feedback submit failed", error);
            alert("Feedback save FAILED: " + (error && error.message ? error.message : JSON.stringify(error)));
            return;
        }
        // Only staff (already holding the real list) need their local copy refreshed.
        if (session) {
            const fb = await loadShared(FEEDBACK_KEY, []);
            setFeedbackList(fb);
        }
    }
    async function persistContactMessages(next) { setContactMessages(next); await saveShared(CONTACT_MESSAGES_KEY, next); }
    async function submitContactMessage(data) {
        // Same reasoning as submitFeedback: anonymous visitors can't SELECT
        // contact-messages-list (RLS), so a read-modify-write here would
        // silently wipe every earlier message. A SECURITY DEFINER Postgres
        // function appends server-side instead. See Step 1 SQL:
        // public.submit_contact_message(payload jsonb).
        const entry = Object.assign({ id: uid(), date: new Date().toISOString(), status: "new" }, data);
        const { error } = await gblssDb.rpc("submit_contact_message", { payload: entry });
        if (error) {
            console.error("Contact message submit failed", error);
            return { ok: false, message: error && error.message ? error.message : "Message could not be sent." };
        }
        // Only staff (already holding the real list) need their local copy refreshed.
        if (session) {
            const cm = await loadShared(CONTACT_MESSAGES_KEY, []);
            setContactMessages(cm);
        }
        return { ok: true };
    }
    function deleteContactMessage(id) {
        persistContactMessages(contactMessages.filter((m) => m.id !== id));
    }
    function deleteFeedback(id) {
        persistFeedback(feedbackList.filter((f) => f.id !== id));
    }
    async function persistTextbooks(next) { setTextbooks(next); await saveShared(TEXTBOOKS_KEY, next); }
    function saveTextbook(data) {
        if (data.id)
            persistTextbooks(textbooks.map((b) => (b.id === data.id ? data : b)));
        else
            persistTextbooks([...textbooks, Object.assign({ id: uid() }, data)]);
    }
    function deleteTextbook(id) {
        persistTextbooks(textbooks.filter((b) => b.id !== id));
    }
    async function persistFuntime(next) { setFuntimeList(next); await saveShared(FUNTIME_KEY, next); }
    function saveFuntime(data) {
        if (data.id)
            persistFuntime(funtimeList.map((f) => (f.id === data.id ? data : f)));
        else
