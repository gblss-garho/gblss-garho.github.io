/* ---------------- DOB format helpers ----------------
   Historically every "dob" field in this app was free text — whatever the
   admin typed ("May 05, 2010", "05/05/2010", ...). We're moving all dob
   inputs to <input type="date">, which always reads/writes ISO
   (yyyy-mm-dd). These helpers bridge old free-text values so nobody's data
   silently breaks or goes missing during the switch. */
const DOB_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function isIsoDob(s) {
    return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "").trim());
}
// Legacy records were entered as DD-MM-YYYY (e.g. "06-04-2012" = 6 April
// 2012). This is NOT the same as what `new Date(v)` assumes for a
// dash-separated string (MM-DD-YYYY, the US convention) — that mismatch was
// silently swapping day/month for any DOB with a day of 12 or under, which
// is what caused GR/DOB lookups to fail. Detect and parse it explicitly.
function isDmyDob(s) {
    return /^\d{2}-\d{2}-\d{4}$/.test(String(s || "").trim());
}
// Best-effort: turn whatever an admin previously typed into ISO so the new
// date picker can pre-fill itself. If it can't be parsed, returns "" (picker
// shows blank) — the original text is NOT lost; it just stays in form state
// until the field is actually touched and re-saved.
function dobToIso(raw) {
    const v = String(raw || "").trim();
    if (!v)
        return "";
    if (isIsoDob(v))
        return v;
    if (isDmyDob(v)) {
        const [dd, mm, yyyy] = v.split("-");
        return `${yyyy}-${mm}-${dd}`;
    }
    const d = new Date(v);
    if (isNaN(d.getTime()))
        return "";
    return d.toISOString().slice(0, 10);
}

function escapeXml(s) {

function extractDocParagraphs(root) {
    const paras = [];
    function walk(el) {
        const children = Array.from(el.children).filter((c) => c.tagName !== "BUTTON" && c.tagName !== "STYLE" && c.tagName !== "svg");
        if (children.length === 0) {
            const text = (el.textContent || "").replace(/\s+/g, " ").trim();
            if (text) {
                const cs = window.getComputedStyle(el);
                const size = parseFloat(cs.fontSize) || 13;
                const weight = parseInt(cs.fontWeight, 10) || 400;
                paras.push({ text, bold: weight >= 600, big: size >= 17 });
            }
            return;
        }
        children.forEach(walk);
    }
    walk(root);
    return paras;
}
async function downloadCardAsWord(selector, filename) {
    const node = document.querySelector(selector);
    if (!node) {
        alert("Print ho sakne wala content nahi mila. Pehle document screen par dikhayein.");
        return;
    }
    const cleanName = filename.replace(/\.docx?$/i, "");
    const paras = extractDocParagraphs(node);
    try {
        const bodyHtml = paras
            .map((p) => `<p style="margin:0 0 8pt 0; font-family:Calibri, Arial, sans-serif; font-size:${p.big ? "16pt" : "11pt"}; font-weight:${p.bold ? "bold" : "normal"};">${escapeXml(p.text)}</p>`)
            .join("");
        const html = "<!DOCTYPE html>" +
            '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
            "<head><meta charset=\"utf-8\"><title>" + escapeXml(cleanName) + "</title></head>" +
            "<body>" + bodyHtml + "</body></html>";
        const blob = new Blob(["\ufeff", html], { type: "application/msword" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = cleanName + ".doc";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    catch (e) {
        console.error("word generation failed", e);
        alert("Word file banane mein masla hua. Barah-e-karam dobara koshish karein.");
    }
}
function calcServiceDuration(entryDate) {
    if (!entryDate)
        return "—";
    const start = new Date(entryDate);
    if (isNaN(start.getTime()))
        return "—";
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    let months = now.getMonth() - start.getMonth();
    if (now.getDate() < start.getDate())
        months--;
    if (months < 0) {
        years--;
        months += 12;
    }
    if (years < 0)
        return "—";
    const yStr = years > 0 ? `${years} year${years !== 1 ? "s" : ""}` : "";
    const mStr = months > 0 ? `${months} month${months !== 1 ? "s" : ""}` : "";
    return [yStr, mStr].filter(Boolean).join(", ") || "< 1 month";
}

/* ---------- School Leaving Certificate — issued records (year-wise) ----------
   Har record ek official "General Register" entry hai jo pehle se issue ho chuki
   hai (jaisa printed Leaving Certificate par darj hota hai). Naya batch/year add
   karne ke liye neechay mkLC(...) ke naye calls DEFAULT_LC_RECORDS mein add karein,
   ya App khulnay ke baad Edit Mode se "+ Add Record" button use karein.
------------------------------------------------------------------------------ */
function mkLC(gr, name, fatherName, caste, placeOfBirth, dob, dobWords, lastSchool, admissionDate, admittedClass = "VI", opts = {}) {
    return {
        id: uid(),
        grNumber: gr,
        name,
        fatherName,
        religion: opts.religion || "Islam",
        caste,
        placeOfBirth,
        dob,
        dobWords,
        lastSchool,
        admissionDate,
        admittedClass,
        progress: opts.progress || "Good",
        conduct: opts.conduct || "Good",
        passedClass: opts.passedClass || "VIII",
        leavingDate: opts.leavingDate || "Mar 29, 2025",
        reason: opts.reason || "VIII Class Passed",
        dues: opts.dues || "Nil",
        remarks: opts.remarks || "L.C Issued",
        issueDate: opts.issueDate || "Mar 29, 2025",
        year: opts.year || "2024-2025",
    };
}
