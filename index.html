<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Government Boys Lower Secondary School Garho</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const SCHOOL_KEY = "school-info";
const TEACHERS_KEY = "teachers-list";
const STUDENTS_KEY = "students-list";
const GALLERY_KEY = "gallery-list";
const PIN_KEY = "edit-pin";

const uid = () => Math.random().toString(36).slice(2, 10);

const DEFAULT_SCHOOL = {
  name: "Government Boys Lower Secondary School Garho",
  urduName: "گورنمنٹ بوائز لوئر سیکنڈری اسکول گڑھو",
  motto: "علم نور ہے — Knowledge is Light",
  establishedYear: "1969",
  emisCode: "404030082",
  address: "Garho, Sindh, Pakistan",
  phone: "03222888313",
  email: "wariskatyar2015@yahoo.com",
  principalName: "Imtiaz Ali Memon",
  principalMessage: "",
  totalClasses: "Nursery – Class 8",
  shifts: "Morning",
};

const DEFAULT_TEACHERS = [
  { id: uid(), name: "Imtiaz Ali Memon", designation: "Head Master", subject: "JEST", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
  { id: uid(), name: "Muhammad Waris", designation: "JEST", subject: "", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
  { id: uid(), name: "Hyder Bux Janiaro", designation: "JEST", subject: "", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
  { id: uid(), name: "Abdul Rasheed Khaskheli", designation: "JEST", subject: "", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
  { id: uid(), name: "Maqbool Ahmed Katiar", designation: "JEST", subject: "", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
  { id: uid(), name: "Shakeel Ahmed Memon", designation: "JEST", subject: "", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
  { id: uid(), name: "Ahmed Ali Memon", designation: "JEST", subject: "", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
  { id: uid(), name: "Rasheed Gulri", designation: "JEST", subject: "", qualification: "", joiningDate: "", contact: "", photoUrl: "" },
];

/* localStorage-based persistence (per-device only — see chat note) */
function loadLocal(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveLocal(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error("save failed", key, e);
  }
}

function Seal({ size = 96 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#C9A227" strokeWidth="2" />
      <circle cx="50" cy="50" r="40" fill="none" stroke="#C9A227" strokeWidth="1" strokeDasharray="2 3" />
      <text x="50" y="38" textAnchor="middle" fontFamily="Noto Serif" fontSize="9" fill="#C9A227" fontWeight="600">GOVERNMENT SCHOOL</text>
      <text x="50" y="58" textAnchor="middle" fontFamily="Noto Serif" fontSize="11" fill="#C9A227" fontWeight="700">GARHO</text>
      <text x="50" y="70" textAnchor="middle" fontFamily="Noto Serif" fontSize="7" fill="#C9A227">EST. REGISTER</text>
    </svg>
  );
}

function SectionLabel({ n, children }) {
  return (
    <div className="flex items-center gap-3 mb-6">
      <span className="flex items-center justify-center rounded-full text-xs font-semibold" style={{ width: 26, height: 26, border: "1.5px solid #C9A227", color: "#C9A227", fontFamily: "JetBrains Mono" }}>{n}</span>
      <h2 className="tracking-wide" style={{ fontFamily: "Noto Serif", fontSize: 26, fontWeight: 700, color: "#0F5132" }}>{children}</h2>
      <div className="flex-1 h-px" style={{ background: "#D8CFB8" }} />
    </div>
  );
}

function Field({ label, ...props }) {
  return (
    <label className="block text-sm mb-3">
      <span className="block mb-1 font-medium" style={{ color: "#4A4237" }}>{label}</span>
      <input {...props} className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ border: "1px solid #D8CFB8", background: "#fff", fontFamily: "Inter" }} />
    </label>
  );
}
function TextAreaField({ label, ...props }) {
  return (
    <label className="block text-sm mb-3">
      <span className="block mb-1 font-medium" style={{ color: "#4A4237" }}>{label}</span>
      <textarea {...props} rows={3} className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ border: "1px solid #D8CFB8", background: "#fff", fontFamily: "Inter" }} />
    </label>
  );
}

function Avatar({ url, name, size = 64, square = false }) {
  const initials = (name || "?").split(" ").map((s) => s[0]).slice(0, 2).join("").toUpperCase();
  return url ? (
    <img src={url} alt={name} style={{ width: size, height: size, objectFit: "cover", borderRadius: square ? 6 : "50%", border: "2px solid #0F5132" }} />
  ) : (
    <div style={{ width: size, height: size, borderRadius: square ? 6 : "50%", background: "#0F5132", color: "#FAF6EC", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Noto Serif", fontWeight: 700, fontSize: size / 2.6 }}>{initials}</div>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start md:items-center justify-center p-4 overflow-y-auto" style={{ background: "rgba(15,81,50,0.35)" }}>
      <div className="w-full max-w-lg rounded-lg shadow-xl my-8" style={{ background: "#FAF6EC", border: "1px solid #D8CFB8" }}>
        <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: "1px solid #D8CFB8" }}>
          <h3 style={{ fontFamily: "Noto Serif", fontWeight: 700, color: "#0F5132", fontSize: 18 }}>{title}</h3>
          <button onClick={onClose} className="text-sm px-2 py-1 rounded" style={{ color: "#4A4237" }}>✕</button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function Btn({ children, variant = "primary", ...props }) {
  const styles = {
    primary: { background: "#0F5132", color: "#FAF6EC", border: "1px solid #0F5132" },
    gold: { background: "#C9A227", color: "#1F2A24", border: "1px solid #C9A227" },
    ghost: { background: "transparent", color: "#0F5132", border: "1px solid #0F5132" },
    danger: { background: "transparent", color: "#8B2E2E", border: "1px solid #8B2E2E" },
  };
  return (
    <button {...props} className="px-4 py-2 rounded-md text-sm font-semibold transition-opacity hover:opacity-80" style={{ ...styles[variant], fontFamily: "Inter" }}>{children}</button>
  );
}

function App() {
  const [tab, setTab] = useState("home");
  const [school, setSchool] = useState(() => loadLocal(SCHOOL_KEY, null) || DEFAULT_SCHOOL);
  const [teachers, setTeachers] = useState(() => loadLocal(TEACHERS_KEY, null) || DEFAULT_TEACHERS);
  const [students, setStudents] = useState(() => loadLocal(STUDENTS_KEY, []));
  const [gallery, setGallery] = useState(() => loadLocal(GALLERY_KEY, []));
  const [pin, setPin] = useState(() => loadLocal(PIN_KEY, "1234"));
  const [editMode, setEditMode] = useState(false);
  const [showPinModal, setShowPinModal] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");

  const [editSchoolOpen, setEditSchoolOpen] = useState(false);
  const [teacherModal, setTeacherModal] = useState(null);
  const [studentModal, setStudentModal] = useState(null);
  const [galleryModal, setGalleryModal] = useState(null);
  const [idCardTarget, setIdCardTarget] = useState(null);
  const [studentFilter, setStudentFilter] = useState("");

  useEffect(() => { saveLocal(SCHOOL_KEY, school); }, [school]);
  useEffect(() => { saveLocal(TEACHERS_KEY, teachers); }, [teachers]);
  useEffect(() => { saveLocal(STUDENTS_KEY, students); }, [students]);
  useEffect(() => { saveLocal(GALLERY_KEY, gallery); }, [gallery]);
  useEffect(() => { saveLocal(PIN_KEY, pin); }, [pin]);

  function tryUnlock() {
    if (pinInput === pin) { setEditMode(true); setShowPinModal(false); setPinInput(""); setPinError(""); }
    else setPinError("Galat PIN. Dobara koshish karein.");
  }

  function saveTeacher(data) {
    if (data.id) setTeachers(teachers.map((t) => (t.id === data.id ? data : t)));
    else setTeachers([...teachers, { ...data, id: uid() }]);
    setTeacherModal(null);
  }
  function saveStudent(data) {
    if (data.id) setStudents(students.map((s) => (s.id === data.id ? data : s)));
    else setStudents([...students, { ...data, id: uid() }]);
    setStudentModal(null);
  }
  function saveGalleryItem(data) {
    if (data.id) setGallery(gallery.map((g) => (g.id === data.id ? data : g)));
    else setGallery([...gallery, { ...data, id: uid() }]);
    setGalleryModal(null);
  }

  const filteredStudents = students.filter((s) => {
    const q = studentFilter.toLowerCase();
    return !q || (s.name && s.name.toLowerCase().includes(q)) || (s.grNumber && s.grNumber.toLowerCase().includes(q)) || (s.class && s.class.toLowerCase().includes(q)) || (s.fatherName && s.fatherName.toLowerCase().includes(q));
  });

  const NAV = [
    ["home", "Home"], ["about", "School Details"], ["teachers", "Teachers"],
    ["students", "Register / Students"], ["gallery", "Gallery"], ["ids", "ID Cards"],
  ];

  return (
    <div style={{ background: "#FAF6EC", minHeight: "100vh", fontFamily: "Inter", color: "#1F2A24" }}>
      <header style={{ background: "#0F5132", color: "#FAF6EC" }}>
        <div className="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div style={{ width: 40, height: 40, flexShrink: 0 }}><Seal size={40} /></div>
            <div>
              <div style={{ fontFamily: "Noto Serif", fontWeight: 700, fontSize: 15, lineHeight: 1.15 }}>{school.name}</div>
              <div style={{ fontSize: 11, opacity: 0.75, fontFamily: "JetBrains Mono" }}>{school.address}</div>
            </div>
          </div>
          <button onClick={() => (editMode ? setEditMode(false) : setShowPinModal(true))} className="text-xs px-3 py-1.5 rounded-full font-semibold flex-shrink-0" style={editMode ? { background: "#C9A227", color: "#1F2A24" } : { border: "1px solid #FAF6EC44", color: "#FAF6EC" }}>
            {editMode ? "✓ Editing — Lock" : "🔒 Edit Mode"}
          </button>
        </div>
        <nav className="max-w-6xl mx-auto px-5 flex gap-1 overflow-x-auto" style={{ borderTop: "1px solid #ffffff22" }}>
          {NAV.map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)} className="px-3 py-2.5 text-sm whitespace-nowrap font-medium" style={{ borderBottom: tab === key ? "2px solid #C9A227" : "2px solid transparent", color: tab === key ? "#FAF6EC" : "#FAF6ECAA" }}>{label}</button>
          ))}
        </nav>
      </header>

      <main className="max-w-6xl mx-auto px-5 py-10">
        {tab === "home" && <HomeTab school={school} teachers={teachers} students={students} setTab={setTab} />}
        {tab === "about" && <AboutTab school={school} editMode={editMode} onEdit={() => setEditSchoolOpen(true)} />}
        {tab === "teachers" && (
          <TeachersTab teachers={teachers} editMode={editMode}
            onAdd={() => setTeacherModal({})} onEdit={(t) => setTeacherModal(t)}
            onDelete={(id) => setTeachers(teachers.filter((t) => t.id !== id))}
            onIdCard={(t) => { setIdCardTarget({ type: "teacher", person: t }); setTab("ids"); }} />
        )}
        {tab === "students" && (
          <StudentsTab students={filteredStudents} total={students.length} filter={studentFilter} setFilter={setStudentFilter} editMode={editMode}
            onAdd={() => setStudentModal({})} onEdit={(s) => setStudentModal(s)}
            onDelete={(id) => setStudents(students.filter((s) => s.id !== id))}
            onIdCard={(s) => { setIdCardTarget({ type: "student", person: s }); setTab("ids"); }} />
        )}
        {tab === "gallery" && (
          <GalleryTab gallery={gallery} editMode={editMode} onAdd={() => setGalleryModal({})} onDelete={(id) => setGallery(gallery.filter((g) => g.id !== id))} />
        )}
        {tab === "ids" && <IdCardsTab teachers={teachers} students={students} school={school} target={idCardTarget} setTarget={setIdCardTarget} />}
      </main>

      <footer className="text-center py-8 text-xs" style={{ color: "#8B8371", fontFamily: "JetBrains Mono" }}>
        {school.name} — records maintained per General Register · data saved on this device/browser only
      </footer>

      {showPinModal && (
        <Modal title="Enter Edit PIN" onClose={() => { setShowPinModal(false); setPinInput(""); setPinError(""); }}>
          <p className="text-sm mb-3" style={{ color: "#4A4237" }}>Default PIN is <b>1234</b>. Aap ise "School Details" edit karte waqt change kar sakte hain.</p>
          <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && tryUnlock()} placeholder="PIN" className="w-full rounded-md px-3 py-2 text-sm mb-2" style={{ border: "1px solid #D8CFB8" }} autoFocus />
          {pinError && <p className="text-xs mb-2" style={{ color: "#8B2E2E" }}>{pinError}</p>}
          <Btn onClick={tryUnlock}>Unlock</Btn>
        </Modal>
      )}

      {editSchoolOpen && (
        <SchoolEditModal school={school} pin={pin} onClose={() => setEditSchoolOpen(false)}
          onSave={(s) => { setSchool(s); setEditSchoolOpen(false); }} onSavePin={setPin} />
      )}

      {teacherModal && (
        <PersonEditModal title={teacherModal.id ? "Edit Teacher" : "Add Teacher"} onClose={() => setTeacherModal(null)} onSave={saveTeacher} initial={teacherModal}
          fields={[["name","Full Name"],["designation","Designation"],["subject","Subject"],["qualification","Qualification"],["joiningDate","Joining Date"],["contact","Contact (optional)"],["photoUrl","Photo URL"]]} />
      )}

      {studentModal && (
        <PersonEditModal title={studentModal.id ? "Edit Student" : "Add Student"} onClose={() => setStudentModal(null)} onSave={saveStudent} initial={studentModal}
          fields={[["grNumber","GR Number"],["name","Full Name"],["fatherName","Father's Name"],["class","Class"],["section","Section"],["dob","Date of Birth"],["admissionDate","Admission Date"],["address","Address (optional)"],["photoUrl","Photo URL"]]} />
      )}

      {galleryModal && (
        <Modal title="Add Photo" onClose={() => setGalleryModal(null)}>
          <GalleryForm onSave={saveGalleryItem} initial={galleryModal} />
        </Modal>
      )}
    </div>
  );
}

function HomeTab({ school, teachers, students, setTab }) {
  const stats = [
    ["Students Enrolled", students.length], ["Teaching Staff", teachers.length],
    ["Classes", school.totalClasses || "—"], ["Established", school.establishedYear || "—"],
  ];
  return (
    <div>
      <div className="rounded-xl p-8 md:p-12 mb-10 relative overflow-hidden" style={{ background: "#0F5132", color: "#FAF6EC" }}>
        <div className="absolute -right-6 -top-6 opacity-20"><Seal size={220} /></div>
        <p style={{ fontFamily: "JetBrains Mono", fontSize: 12, letterSpacing: 2, color: "#C9A227" }}>REGISTER No. 001 · GARHO</p>
        <h1 style={{ fontFamily: "Noto Serif", fontWeight: 700, fontSize: "clamp(28px,4vw,44px)", maxWidth: 640, marginTop: 8 }}>{school.name}</h1>
        <p className="mt-3 max-w-xl" style={{ color: "#FAF6ECCC" }}>{school.motto}</p>
        <div className="flex gap-3 mt-6 flex-wrap">
          <Btn variant="gold" onClick={() => setTab("students")}>View Student Register</Btn>
          <Btn variant="ghost" style={{ borderColor: "#FAF6EC", color: "#FAF6EC" }} onClick={() => setTab("teachers")}>Meet the Teachers</Btn>
        </div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
        {stats.map(([label, val]) => (
          <div key={label} className="rounded-lg p-5 text-center" style={{ border: "1px solid #D8CFB8", background: "#fff" }}>
            <div style={{ fontFamily: "Noto Serif", fontWeight: 700, fontSize: 30, color: "#0F5132" }}>{val}</div>
            <div className="text-xs mt-1" style={{ color: "#4A4237", fontFamily: "JetBrains Mono" }}>{label}</div>
          </div>
        ))}
      </div>
      {school.principalMessage && (
        <div className="rounded-lg p-6" style={{ border: "1px solid #D8CFB8", background: "#fff" }}>
          <p style={{ fontFamily: "Noto Serif", fontSize: 18, fontStyle: "italic", color: "#1F2A24" }}>&ldquo;{school.principalMessage}&rdquo;</p>
          <p className="mt-3 text-sm font-semibold" style={{ color: "#0F5132" }}>— {school.principalName || "Principal"}</p>
        </div>
      )}
    </div>
  );
}

function AboutTab({ school, editMode, onEdit }) {
  const rows = [
    ["School Name", school.name], ["Urdu Name", school.urduName], ["Established", school.establishedYear],
    ["EMIS Code", school.emisCode], ["Address", school.address], ["Phone", school.phone],
    ["Email", school.email], ["Classes Offered", school.totalClasses], ["Shift", school.shifts], ["Principal", school.principalName],
  ];
  return (
    <div>
      <div className="flex items-center justify-between">
        <SectionLabel n="01">School Details</SectionLabel>
        {editMode && <Btn onClick={onEdit}>Edit Details</Btn>}
      </div>
      <div className="rounded-lg overflow-hidden" style={{ border: "1px solid #D8CFB8", background: "#fff" }}>
        {rows.map(([label, val], i) => (
          <div key={label} className="flex px-5 py-3 text-sm" style={{ borderBottom: i < rows.length - 1 ? "1px solid #EDE6D6" : "none" }}>
            <div className="w-40 flex-shrink-0 font-semibold" style={{ color: "#0F5132" }}>{label}</div>
            <div style={{ color: "#1F2A24" }}>{val || "—"}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TeachersTab({ teachers, editMode, onAdd, onEdit, onDelete, onIdCard }) {
  return (
    <div>
      <div className="flex items-center justify-between">
        <SectionLabel n="02">Teachers' Biodata</SectionLabel>
        {editMode && <Btn onClick={onAdd}>+ Add Teacher</Btn>}
      </div>
      {teachers.length === 0 ? (
        <EmptyState text="Abhi koi teacher record nahi hai. Edit Mode on karke pehla record add karein." />
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {teachers.map((t) => (
            <div key={t.id} className="rounded-lg p-5" style={{ border: "1px solid #D8CFB8", background: "#fff" }}>
              <div className="flex gap-3 items-center">
                <Avatar url={t.photoUrl} name={t.name} />
                <div>
                  <div className="font-semibold" style={{ color: "#0F5132", fontFamily: "Noto Serif" }}>{t.name || "Unnamed"}</div>
                  <div className="text-xs" style={{ color: "#4A4237" }}>{t.designation}{t.subject ? ` · ${t.subject}` : ""}</div>
                </div>
              </div>
              <div className="text-xs mt-3 space-y-1" style={{ color: "#4A4237" }}>
                {t.qualification && <div>🎓 {t.qualification}</div>}
                {t.joiningDate && <div>📅 Joined {t.joiningDate}</div>}
                {t.contact && <div>📞 {t.contact}</div>}
              </div>
              <div className="flex gap-2 mt-4">
                <Btn variant="ghost" onClick={() => onIdCard(t)}>ID Card</Btn>
                {editMode && <Btn variant="ghost" onClick={() => onEdit(t)}>Edit</Btn>}
                {editMode && <Btn variant="danger" onClick={() => onDelete(t.id)}>Delete</Btn>}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StudentsTab({ students, total, filter, setFilter, editMode, onAdd, onEdit, onDelete, onIdCard }) {
  return (
    <div>
      <div className="flex items-center justify-between flex-wrap gap-3">
        <SectionLabel n="03">Student Register</SectionLabel>
        {editMode && <Btn onClick={onAdd}>+ Add Student</Btn>}
      </div>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <input value={filter} onChange={(e) => setFilter(e.target.value)} placeholder="Search by name, GR number, class, father's name…" className="px-3 py-2 rounded-md text-sm w-full max-w-sm" style={{ border: "1px solid #D8CFB8" }} />
        <span className="text-xs" style={{ color: "#4A4237", fontFamily: "JetBrains Mono" }}>{students.length} of {total} shown</span>
      </div>
      {total === 0 ? (
        <EmptyState text="Abhi koi student record nahi hai. Edit Mode on karke General Register se pehli entry add karein." />
      ) : (
        <div className="rounded-lg overflow-x-auto" style={{ border: "1px solid #D8CFB8", background: "#fff" }}>
          <table className="w-full text-sm" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ background: "#0F5132", color: "#FAF6EC" }}>
                {["", "GR #", "Name", "Father's Name", "Class", "Sec", "DOB", "Admission", ""].map((h) => (
                  <th key={h} className="text-left px-3 py-2 font-medium" style={{ fontFamily: "JetBrains Mono", fontSize: 11 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {students.map((s, i) => (
                <tr key={s.id} style={{ borderTop: "1px solid #EDE6D6", background: i % 2 ? "#FAF6EC" : "#fff" }}>
                  <td className="px-3 py-2"><Avatar url={s.photoUrl} name={s.name} size={32} /></td>
                  <td className="px-3 py-2" style={{ fontFamily: "JetBrains Mono" }}>{s.grNumber}</td>
                  <td className="px-3 py-2 font-medium">{s.name}</td>
                  <td className="px-3 py-2">{s.fatherName}</td>
                  <td className="px-3 py-2">{s.class}</td>
                  <td className="px-3 py-2">{s.section}</td>
                  <td className="px-3 py-2">{s.dob}</td>
                  <td className="px-3 py-2">{s.admissionDate}</td>
                  <td className="px-3 py-2">
                    <div className="flex gap-1.5 flex-wrap">
                      <button onClick={() => onIdCard(s)} className="text-xs underline" style={{ color: "#0F5132" }}>ID</button>
                      {editMode && <button onClick={() => onEdit(s)} className="text-xs underline" style={{ color: "#0F5132" }}>Edit</button>}
                      {editMode && <button onClick={() => onDelete(s.id)} className="text-xs underline" style={{ color: "#8B2E2E" }}>Del</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function GalleryTab({ gallery, editMode, onAdd, onDelete }) {
  return (
    <div>
      <div className="flex items-center justify-between">
        <SectionLabel n="04">School Gallery</SectionLabel>
        {editMode && <Btn onClick={onAdd}>+ Add Photo</Btn>}
      </div>
      {gallery.length === 0 ? (
        <EmptyState text="Abhi koi photo nahi hai. Edit Mode on karke school, teachers ya students ki photo (URL) add karein." />
      ) : (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
          {gallery.map((g) => (
            <div key={g.id} className="rounded-lg overflow-hidden relative group" style={{ border: "1px solid #D8CFB8" }}>
              <img src={g.url} alt={g.caption} className="w-full h-40 object-cover" />
              {g.caption && <div className="text-xs px-2 py-1.5" style={{ background: "#fff", color: "#4A4237" }}>{g.caption}</div>}
              {editMode && (
                <button onClick={() => onDelete(g.id)} className="absolute top-2 right-2 text-xs px-2 py-1 rounded" style={{ background: "#8B2E2Edd", color: "#fff" }}>Delete</button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function IdCardsTab({ teachers, students, school, target, setTarget }) {
  const printRef = useRef(null);
  function print() { window.print(); }
  return (
    <div>
      <SectionLabel n="05">ID Card Generator</SectionLabel>
      <div className="grid md:grid-cols-3 gap-6">
        <div className="md:col-span-1">
          <p className="text-xs font-semibold mb-2" style={{ color: "#0F5132" }}>Select Teacher</p>
          <div className="rounded-lg mb-4 max-h-40 overflow-y-auto" style={{ border: "1px solid #D8CFB8", background: "#fff" }}>
            {teachers.length === 0 && <p className="text-xs p-3" style={{ color: "#8B8371" }}>No teachers yet</p>}
            {teachers.map((t) => (
              <button key={t.id} onClick={() => setTarget({ type: "teacher", person: t })} className="w-full text-left px-3 py-2 text-sm hover:opacity-70" style={{ borderBottom: "1px solid #EDE6D6" }}>{t.name}</button>
            ))}
          </div>
          <p className="text-xs font-semibold mb-2" style={{ color: "#0F5132" }}>Select Student</p>
          <div className="rounded-lg max-h-40 overflow-y-auto" style={{ border: "1px solid #D8CFB8", background: "#fff" }}>
            {students.length === 0 && <p className="text-xs p-3" style={{ color: "#8B8371" }}>No students yet</p>}
            {students.map((s) => (
              <button key={s.id} onClick={() => setTarget({ type: "student", person: s })} className="w-full text-left px-3 py-2 text-sm hover:opacity-70" style={{ borderBottom: "1px solid #EDE6D6" }}>{s.name} <span style={{ color: "#8B8371" }}>({s.grNumber})</span></button>
            ))}
          </div>
        </div>
        <div className="md:col-span-2">
          {!target ? (
            <EmptyState text="Bayen taraf se koi teacher ya student chunain ID card banane ke liye." />
          ) : (
            <div>
              <div ref={printRef} className="print-card" style={{ width: 320, borderRadius: 14, overflow: "hidden", border: "1px solid #D8CFB8", boxShadow: "0 8px 24px rgba(15,81,50,0.15)", background: "#fff", fontFamily: "Inter" }}>
                <div style={{ background: "#0F5132", color: "#FAF6EC", padding: "14px 16px", display: "flex", alignItems: "center", gap: 10 }}>
                  <Seal size={34} />
                  <div>
                    <div style={{ fontFamily: "Noto Serif", fontWeight: 700, fontSize: 12, lineHeight: 1.2 }}>{school.name}</div>
                    <div style={{ fontSize: 9, opacity: 0.8, fontFamily: "JetBrains Mono", letterSpacing: 1 }}>{target.type === "teacher" ? "STAFF IDENTITY CARD" : "STUDENT IDENTITY CARD"}</div>
                  </div>
                </div>
                <div style={{ padding: 16, display: "flex", gap: 14 }}>
                  <Avatar url={target.person.photoUrl} name={target.person.name} size={72} square />
                  <div style={{ fontSize: 12, color: "#1F2A24" }}>
                    <div style={{ fontFamily: "Noto Serif", fontWeight: 700, fontSize: 15, color: "#0F5132" }}>{target.person.name}</div>
                    {target.type === "teacher" ? (
                      <>
                        <div>{target.person.designation}{target.person.subject ? ` · ${target.person.subject}` : ""}</div>
                        <div style={{ color: "#4A4237" }}>{target.person.qualification}</div>
                      </>
                    ) : (
                      <>
                        <div>Class {target.person.class}{target.person.section ? `-${target.person.section}` : ""}</div>
                        <div style={{ color: "#4A4237" }}>S/O {target.person.fatherName}</div>
                      </>
                    )}
                  </div>
                </div>
                <div style={{ padding: "0 16px 16px", fontFamily: "JetBrains Mono", fontSize: 10, color: "#4A4237" }}>
                  {target.type === "student" ? `GR No: ${target.person.grNumber || "—"}` : `Contact: ${target.person.contact || "—"}`}
                </div>
                <div style={{ height: 6, background: "#C9A227" }} />
              </div>
              <Btn variant="gold" onClick={print} className="mt-4">🖨 Print / Save as PDF</Btn>
            </div>
          )}
        </div>
      </div>
      <style>{`
        @media print {
          body * { visibility: hidden; }
          .print-card, .print-card * { visibility: visible; }
          .print-card { position: fixed; top: 40px; left: 40px; }
        }
      `}</style>
    </div>
  );
}

function SchoolEditModal({ school, pin, onClose, onSave, onSavePin }) {
  const [form, setForm] = useState(school);
  const [newPin, setNewPin] = useState(pin);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  return (
    <Modal title="Edit School Details" onClose={onClose}>
      <Field label="School Name" value={form.name} onChange={set("name")} />
      <Field label="Urdu Name" value={form.urduName} onChange={set("urduName")} />
      <Field label="Motto" value={form.motto} onChange={set("motto")} />
      <div className="grid grid-cols-2 gap-3">
        <Field label="Established Year" value={form.establishedYear} onChange={set("establishedYear")} />
        <Field label="EMIS Code" value={form.emisCode} onChange={set("emisCode")} />
      </div>
      <Field label="Address" value={form.address} onChange={set("address")} />
      <div className="grid grid-cols-2 gap-3">
        <Field label="Phone" value={form.phone} onChange={set("phone")} />
        <Field label="Email" value={form.email} onChange={set("email")} />
      </div>
      <Field label="Classes Offered" value={form.totalClasses} onChange={set("totalClasses")} />
      <Field label="Shift" value={form.shifts} onChange={set("shifts")} />
      <Field label="Principal Name" value={form.principalName} onChange={set("principalName")} />
      <TextAreaField label="Principal's Message" value={form.principalMessage} onChange={set("principalMessage")} />
      <div className="mt-4 pt-4" style={{ borderTop: "1px solid #D8CFB8" }}>
        <Field label="Change Edit PIN" value={newPin} onChange={(e) => setNewPin(e.target.value)} />
      </div>
      <div className="flex gap-2 mt-2">
        <Btn onClick={() => { onSave(form); if (newPin !== pin) onSavePin(newPin); }}>Save Changes</Btn>
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

function PersonEditModal({ title, initial, fields, onClose, onSave }) {
  const [form, setForm] = useState(initial);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  return (
    <Modal title={title} onClose={onClose}>
      {fields.map(([key, label]) => (
        <Field key={key} label={label} value={form[key] || ""} onChange={set(key)} />
      ))}
      {form.photoUrl && <div className="mb-3"><Avatar url={form.photoUrl} name={form.name} size={56} /></div>}
      <div className="flex gap-2 mt-2">
        <Btn onClick={() => onSave({ ...form, id: initial.id })}>Save</Btn>
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

function GalleryForm({ initial, onSave }) {
  const [url, setUrl] = useState(initial.url || "");
  const [caption, setCaption] = useState(initial.caption || "");
  return (
    <div>
      <Field label="Image URL" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://…" />
      <Field label="Caption (optional)" value={caption} onChange={(e) => setCaption(e.target.value)} />
      {url && <img src={url} alt="" className="w-full h-32 object-cover rounded mb-3" />}
      <Btn onClick={() => onSave({ id: initial.id, url, caption })}>Save Photo</Btn>
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="rounded-lg p-10 text-center text-sm" style={{ border: "1px dashed #D8CFB8", color: "#8B8371" }}>{text}</div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
